name: localsend_app
description: An open source cross-platform alternative to AirDrop
homepage: https://localsend.org/
publish_to: "none"

version: 1.15.4+54

environment:
  flutter: ">=3.13.0"
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  app_group_directory: 2.0.0
  basic_utils: 5.7.0
  collection: ^1.17.2 # allow newer versions, so it can compile with newer Flutter versions
  common:
    path: ../common
  connectivity_plus: 5.0.2
  dart_mappable: 4.2.2
  desktop_drop: 0.4.4
  device_apps: 2.2.0
  device_info_plus: 9.1.2
  dio: 5.4.3+1
  dynamic_color: 1.7.0
  file_picker: 8.0.2
  file_selector: 1.0.3
  flutter:
    sdk: flutter
  flutter_displaymode: 0.6.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown: 0.6.19
  gal: 2.3.0
  image_picker: 1.0.8
  in_app_purchase: 3.1.13 # [FOSS_REMOVE]
  intl: ^0.18.0 # allow newer versions, so it can compile with newer Flutter versions
  legalize: ^1.2.2
  logging: 1.2.0
  # https://github.com/NightFeather0615/macos_dock_progress/issues/1
  # macos_dock_progress: 1.1.0
  mime: 1.0.4
  nanoid2: 2.0.1
  network_info_plus: 5.0.3
  open_filex: 4.4.0
  package_info_plus: 4.2.0
  pasteboard: ^0.2.0
  path: 1.8.3
  path_provider: 2.1.2
  permission_handler: 11.0.1
  pretty_qr_code: 3.3.0
  refena_flutter: 2.1.1
  refena_inspector_client: 2.0.0
  routerino: 0.8.0
  saf_stream: 0.4.0
  screen_retriever: 0.1.9
  share_handler: 0.0.19
  share_handler_ios: 0.0.12 # Keep iOS <14 support
  shared_preferences: 2.2.3
  # ADR-0009: non-endorsed vita implementations, listed beside the plugins they
  # implement. This is the whole edit an app author makes.
  file_selector_vita:
    path: ../../../../plugins/file_selector_vita
  path_provider_vita:
    path: ../../../../plugins/path_provider_vita
  shared_preferences_vita:
    path: ../../../../plugins/shared_preferences_vita
  shared_preferences_platform_interface: any
  shared_storage: 0.8.1
  slang: 3.31.1
  slang_flutter: 3.31.0
  system_settings: 2.1.0
  tray_manager: 0.2.3
  uri_content: 2.2.0
  url_launcher: 6.2.4
  uuid: 3.0.7
  wakelock_plus: 1.1.4
  wechat_assets_picker: 8.8.1+1
  win32_registry: 1.1.2
  window_manager: 0.3.9
  windows_taskbar: 1.1.2
  yaru: 1.2.2

dev_dependencies:
  # Codegen tooling removed for the Vita build.
  #
  # dart_mappable, slang, flutter_gen and mockito all run through build_runner,
  # and every file they produce is already committed. None of it runs during
  # `flutter build bundle`. But pub still has to *solve* dev dependencies it
  # will never execute, and this set cannot be solved against Dart 3.12:
  # dart_mappable_builder pins an analyzer that wants the withdrawn `macros`
  # package. Nothing here is a Vita problem.
  flutter_lints: ^6.0.0

dependency_overrides:
  # v1.15.4 pins exact patch versions that predate the pinned Flutter. These
  # are the ones flutter_localizations and the framework force. Version bumps
  # only, no behaviour, and nothing to do with the Vita.
  path: 1.9.1
  intl: 0.20.2
  # Packages that predate the framework-wide XxxTheme -> XxxThemeData rename,
  # or use APIs since removed from dart:core (UnmodifiableUint8ListView) and
  # the framework (DecoderCallback). Newest release of each compiles. None of
  # them run on this platform -- win32, photo_manager and wechat_assets_picker
  # are Windows and mobile gallery code -- but they still have to compile.
  win32: any
  photo_manager: any
  yaru: any
  wechat_assets_picker: any
  wechat_picker_library: any
  window_manager: any
  # Bumping win32 to 6.x forces every package pinned to win32 5.x with it.
  # All of this is Windows-only code that cannot run here and still has to
  # compile.
  file_picker: any
  win32_registry: any
  network_info_plus: any
  package_info_plus: any
  device_info_plus: any
  permission_handler: any
  permission_handler_windows:
    # Remove windows support as it causes trouble with Windows 7
    # https://github.com/Baseflow/flutter-permission-handler/issues/1034
    git:
      url: https://github.com/localsend/permission_handler_windows_noop.git
      ref: 2dadd8afbf81e0e3e4791d7144e689555e58f649
  # Force newer version than Flutter 3.13 allows so that file_picker >= 8.0.1 can be used.
  # There is a critical bug in file_picker that needs to be fixed: https://github.com/miguelpruivo/flutter_file_picker/issues/1412
  # Since LocalSend doesn't support web anyway, we can ignore compilation errors for web.
  web: 0.5.1

flutter:
  uses-material-design: true

  assets:
    - assets/img/
    - assets/web/
    - assets/CHANGELOG.md

flutter_gen:
  line_length: 150

# The PS Vita build (flutter-vita): its own title id, so it installs beside the
# apps in the dev slot, and LiveArea art made from assets/img/logo-512.png.
vita:
  title_id: LSND00001
  name: LocalSend
  livearea: vita/livearea
